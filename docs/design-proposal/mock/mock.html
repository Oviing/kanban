<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Kanban — Werkstatt mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mock.css"></head><body>
<div id="root"></div>
<script>
const v=new URLSearchParams(location.search).get('view')||'board';
const sh=s=>`<span class="sh ${s}"></span>`;
const lease=(n,low)=>`<div class="lease ${low?'low':''}">${Array.from({length:12},(_,i)=>`<i class="${i<n?'':'off'}"></i>`).join('')}<small>${Math.round(n*2.5)}M</small></div>`;
const card=(o)=>`<div class="card ${o.cls||''}"><div class="top1">${sh(o.s)}<span class="cap">${o.sn}</span>${o.pri?`<span class="pri" style="margin-left:6px">${o.pri}</span>`:''}<span class="cap id">${o.id}</span></div>
<h4>${o.t}</h4>${o.ev?`<div class="evid">${o.ev}</div>`:''}
<div class="tags">${(o.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}${o.ag?`<span class="ag" style="margin-left:auto">${o.ag}</span>`:''}</div>
${o.lease?lease(o.lease,o.low):''}${o.q?`<div class="q"><b>INPUT REQUIRED</b>${o.q}</div>`:''}${o.confirm?`<button class="btn confirm">Confirm</button>`:''}</div>`;
const col=(n,name,count,body,sk)=>`<div class="col"><div class="ch"><span class="n">${n}</span><div class="t"><span class="cap">${name}</span></div>${sh(sk)}<span class="c">${count}</span></div><div class="stack">${body}</div></div>`;
const topbar=(on,extra='')=>`<div class="top"><div class="logo"><i></i><i></i><i></i><i></i></div><div class="brand">Agent<span>/Kanban</span></div>
<nav class="nav"><a class="${on=='b'?'on':''}">Board</a><a class="${on=='a'?'on':''}">Agents</a><a class="${on=='k'?'on':''}">Keys</a></nav><div class="sp"></div>
<div class="stat"><span class="cap mid">Agents live</span><b>2/3</b></div><div class="stat alert"><span class="cap">Needs you</span><b>4</b></div><div class="me">LU</div></div>`;
const rail=`<aside class="rail"><h2><span class="cap">Needs you</span><span class="count">4</span></h2>
<div class="need"><div class="k"><i></i><span class="cap" style="color:var(--red)">Input required · coder</span></div><h3>Fix flaky lease-expiry integration test</h3><p>“Should I raise the test timeout or fix the clock mocking?”</p><div class="acts"><button class="btn red sm">Answer</button></div></div>
<div class="need"><div class="k rv"><i></i><span class="cap">Review · reviewer</span></div><h3>Cache board overview query</h3><p>Added 5s memoised overview; p95 down to 41ms.</p><div class="acts"><button class="btn fill sm">Approve</button><button class="btn sm">Changes</button></div></div>
<div class="need"><div class="k cf"><i></i><span class="cap">Confirm · coder</span></div><h3>Add pagination to activity feed</h3><div class="acts"><button class="btn fill sm">Confirm</button></div></div>
<div class="need"><div class="k cf"><i></i><span class="cap">Confirm · docs-bot</span></div><h3>Document MCP tool list in README</h3><div class="acts"><button class="btn fill sm">Confirm</button></div></div></aside>`;
const cols=`<div class="cols">
${col('01','Proposed',2,card({s:'proposed',sn:'Proposed',id:'AK-9',t:'Add pagination to activity feed',tags:['api'],ag:'coder',cls:'prop',confirm:1})+card({s:'proposed',sn:'Proposed',id:'AK-10',t:'Document MCP tool list in README',tags:['docs'],ag:'docs-bot',cls:'prop',confirm:1}),'proposed')}
${col('02','Confirmed',2,card({s:'confirmed',sn:'Confirmed',id:'AK-7',t:'Audit API key scopes',tags:['security']})+card({s:'confirmed',sn:'Confirmed',id:'AK-6',t:'Export activity log as CSV',tags:['feature']}),'confirmed')}
${col('03','In progress',4,card({s:'progress',sn:'Active',id:'AK-1',pri:'P3',t:'Rate-limit the public webhook endpoint',tags:['api','security'],ag:'coder',lease:11,cls:'hot'})+card({s:'progress',sn:'Active',id:'AK-4',pri:'P3',t:'Fix flaky lease-expiry integration test',tags:['tests'],ag:'coder',lease:3,low:1,cls:'ask hot',q:'Should I raise the test timeout or fix the clock mocking?'})+card({s:'progress',sn:'Active',id:'AK-2',t:'Migrate session store to Postgres',tags:['backend'],ag:'coder',lease:9})+card({s:'progress',sn:'Active',id:'AK-3',t:'Write onboarding guide for self-hosting',tags:['docs'],ag:'docs-bot',lease:12}),'progress')}
${col('04','Review',1,card({s:'review',sn:'Review',id:'AK-8',t:'Cache board overview query',tags:['perf'],ag:'reviewer',ev:'Added 5s memoised overview; p95 down to 41ms. Invalidated on SSE events. <span class="mono" style="font-size:11px;white-space:nowrap">↗ 1 link</span>'}),'review')}
<div class="col"><div class="cdone"><span>05 — DONE · 1 — SHOW</span></div></div></div>`;
const bar=`<div class="bar"><div class="tab on">Main</div><div class="tab ghost">+ Project</div><div class="add"><span class="cap">＋</span><span>New task — press <kbd>N</kbd></span></div><div class="toggle"><span class="cap">Humans in loop</span><div class="sw"></div></div></div>`;
const R=document.getElementById('root');
if(v=='board') R.innerHTML=topbar('b')+bar+`<div class="app">${rail}${cols}</div>`;
if(v=='task') R.innerHTML=topbar('b')+bar+`<div class="app">${rail}${cols}</div><div class="dim"></div>
<div class="drawer"><div class="dh"><div style="display:flex;align-items:center;gap:10px">${sh('progress')}<span class="cap">In progress</span><span class="pri">P3</span><span class="cap mid" style="margin-left:auto">AK-4 · Esc to close</span></div><h1>Fix flaky lease-expiry integration test</h1>
<div style="display:flex;gap:6px"><span class="tag">tests</span><span class="tag">ci</span></div></div>
<div class="grid2"><div><span class="cap">Assignee</span><b style="color:var(--blue)">coder</b></div><div><span class="cap">Lease</span><b>7M LEFT</b></div><div><span class="cap">Opened</span><b>06:46</b></div><div><span class="cap">Rev</span><b>v6</b></div></div>
<div class="sec" style="background:var(--red);color:#fff;border-color:var(--ink)"><span class="cap" style="color:#fff">Input required</span><p style="font-size:15px;font-weight:600;margin-bottom:12px">Should I raise the test timeout or fix the clock mocking?</p><div class="field" style="background:var(--sheet);color:var(--ink);border-color:var(--ink)"><span>Your answer…</span><button class="btn fill sm">Send</button></div></div>
<div class="sec"><span class="cap">Description</span><p>Fails roughly 1 in 20 runs on CI. Suspect real timers inside the lease sweeper.</p></div>
<div class="sec"><span class="cap">Activity</span><div class="tl"><div class="now"><time>06:46</time><b class="mono" style="color:var(--blue)">coder</b> asked a question</div><div><time>06:46</time><b class="mono" style="color:var(--blue)">coder</b> claimed the task</div><div><time>06:45</time>Local user confirmed</div><div><time>06:45</time>Local user created</div></div></div>
<div class="sec" style="border:0"><span class="cap">Comments</span><div class="comment"><span class="cap">coder · 06:46</span>Reproduced locally with --repeat 50. Clock skew in sweeper.</div></div></div>`;
if(v=='agents'){document.body.classList.add('dark');
const row=(n,st,stc,task,l,w,low,trace)=>`<div class="tr"><div class="who">${sh(st)}<div><b>${n}</b><span class="cap" style="color:${stc}">${task?'':''}${n=='coder'?'Blocked on you':n=='reviewer'?'Idle':'Working'}</span></div></div><div>${task?`<div style="font-weight:500">${task}</div><div class="trace">${trace.map(x=>`<i style="height:${x}%"></i>`).join('')}</div>`:`<span class="mid mono" style="font-size:12px">Last active 10s ago</span>`}</div><div>${l?lease(l,low):`<span class="cap mid">No claim</span>`}</div><div class="mono" style="text-align:right;font-weight:700">${w}</div></div>`;
const tr1=[20,35,60,40,80,55,70,90,45,30,60,75,100,40,25,50,65,85,40,20,35,60,80,55];
R.innerHTML=topbar('a')+`<div class="bar"><div class="tab on">Main</div><div class="tab ghost">All projects</div><div class="add"><span class="pulse" style="width:8px;height:8px;background:#35d07f;display:inline-block"></span><span class="cap">Live · connected</span></div></div>
<div class="kpis"><div class="kpi"><span class="cap mid">Agents working</span><div class="big">2<small> / 3</small></div></div><div class="kpi red"><span class="cap">Waiting on a human</span><div class="big">4</div></div><div class="kpi yellow"><span class="cap mid">Stale leases</span><div class="big">0</div></div><div class="kpi"><span class="cap mid">Done today</span><div class="big">1</div></div></div>
<div class="split"><div class="tbl"><div class="tr h"><span class="cap">Agent</span><span class="cap">Current task · last hour</span><span class="cap">Lease</span><span class="cap" style="text-align:right">WIP</span></div>
${row('coder','progress','var(--red)','Fix flaky lease-expiry integration test',3,3,1,tr1)}${row('docs-bot','progress','var(--blue)','Write onboarding guide for self-hosting',12,1,0,tr1.slice().reverse())}${row('reviewer','confirmed','var(--mid)','',0,0,0,[])}
<div style="padding:20px"><span class="cap mid">Pipeline</span><div class="pipe" style="margin-top:12px"><i style="flex:2;background:transparent;box-shadow:inset 0 0 0 1px var(--mid)"></i><i style="flex:2;background:var(--ink)"></i><i style="flex:4;background:var(--blue)"></i><i style="flex:1;background:var(--yellow)"></i><i style="flex:1;background:var(--mid)"></i></div><div style="display:flex;gap:18px;margin-top:10px" class="cap mid"><span>2 Proposed</span><span>2 Confirmed</span><span>4 Active</span><span>1 Review</span><span>1 Done</span></div></div></div>
<div class="feed"><h2><span class="cap">Live activity</span></h2>
<div class="fe"><time>06:46</time><span>Local user approved <b>AK-5</b> Add dark mode to Agents screen</span></div><div class="fe"><time>06:46</time><span><b>docs-bot</b> submitted <b>AK-5</b> for review</span></div><div class="fe"><time>06:46</time><span><b>reviewer</b> submitted <b>AK-8</b> for review</span></div><div class="fe"><time>06:46</time><span><b>coder</b> asked a question on <b>AK-4</b></span></div><div class="fe"><time>06:46</time><span><b>docs-bot</b> claimed <b>AK-3</b></span></div><div class="fe"><time>06:46</time><span><b>coder</b> claimed <b>AK-2</b></span></div><div class="fe"><time>06:46</time><span><b>coder</b> commented on <b>AK-1</b></span></div><div class="fe"><time>06:46</time><span><b>docs-bot</b> proposed <b>AK-10</b></span></div></div></div>`;}
if(v=='system') R.innerHTML=topbar('b')+`<div class="sys">
<div class="cell" style="grid-column:span 12"><span class="cap mid">Type</span><div style="display:flex;gap:48px;align-items:flex-end;margin-top:14px"><div><div style="font:300 76px/0.9 var(--sans);letter-spacing:-.05em">Aa 0123</div><span class="cap mid">Archivo Light 300 — numerals, display</span></div><div><div style="font:700 26px/1.1 var(--sans);letter-spacing:-.02em">Task titles in Archivo 600</div><span class="cap mid">Archivo 600/700 — content</span></div><div><div style="font:600 20px var(--mono)">AK-42 · 12M LEFT</div><span class="cap mid">JetBrains Mono — data, labels, IDs</span></div></div></div>
<div class="cell" style="grid-column:span 6"><span class="cap mid">Colour — three primaries, used as signals only</span><div style="display:grid;grid-template-columns:repeat(6,1fr);margin-top:14px;border:1px solid var(--ink)">
<div class="sw2" style="background:#131313;color:#F5F3EE">INK<br>#131313</div><div class="sw2" style="background:#F5F3EE">SHEET<br>#F5F3EE</div><div class="sw2" style="background:#E8E5DD">PAPER<br>#E8E5DD</div><div class="sw2" style="background:#E5391B;color:#fff">SIGNAL<br>#E5391B<br>needs you</div><div class="sw2" style="background:#F2B308">AMBER<br>#F2B308<br>review</div><div class="sw2" style="background:#1C3FA3;color:#fff">COBALT<br>#1C3FA3<br>agent</div></div></div>
<div class="cell" style="grid-column:span 6"><span class="cap mid">Status = shape. Readable in greyscale.</span><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px;align-items:center">${['proposed','confirmed','progress','review','done'].map((s,i)=>`<div style="display:flex;flex-direction:column;gap:12px;align-items:flex-start"><span class="sh ${s}" style="transform:scale(2);margin:4px"></span><span class="cap">${['Proposed','Confirmed','Active','Review','Done'][i]}</span><span class="mono mid" style="font-size:10px">${['dashed ring','solid disc','cobalt square','amber triangle','concentric'][i]}</span></div>`).join('')}</div></div>
<div class="cell" style="grid-column:span 4"><span class="cap mid">Lease — 12 segments, 2.5 min each</span><div style="margin-top:16px">${lease(12)}${lease(7)}${lease(3,1)}</div></div>
<div class="cell" style="grid-column:span 4"><span class="cap mid">Buttons — square, mono caps</span><div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap"><button class="btn fill">Approve</button><button class="btn">Changes</button><button class="btn red">Answer</button></div></div>
<div class="cell" style="grid-column:span 4"><span class="cap mid">Rules</span><div style="margin-top:14px;font-size:13px;line-height:1.7"><div>0 px radius · 0 shadows</div><div>1 px hairline · 2 px structure</div><div>8 px base grid</div><div>Colour only when it means something</div></div></div></div>`;
</script></body></html>
