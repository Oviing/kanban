<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Agent Kanban — Clear mockup</title>
<link rel="stylesheet" href="clear.css"></head><body><div id="root"></div>
<script>
const q=new URLSearchParams(location.search);const v=q.get('view')||'board';if(q.get('dark'))document.body.classList.add('dark');
const ring=(p,c='var(--green)')=>`<svg class="ring" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="var(--fill)" stroke-width="3"/><circle cx="10" cy="10" r="7.5" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(47.1*p).toFixed(1)} 47.1"/></svg>`;
const av=n=>`<span class="who"><span class="av ${n=='coder'?'coder':n=='docs-bot'?'docs':'rev'}">${n[0].toUpperCase()}</span>${n}</span>`;
const card=o=>`<div class="card ${o.c||''}"><h4>${o.t}</h4>${o.ev?`<div class="ev">${o.ev}</div>`:''}${o.q?`<div class="ask-box"><b>${o.who} is asking</b>${o.q}</div>`:''}
<div class="row">${o.pri?`<span class="pri">${o.pri}</span>`:''}${(o.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}${o.link?`<span class="lnk">1 link ↗</span>`:''}${o.who&&!o.noav?av(o.who):''}${o.ring!=null?ring(o.ring,o.rc):''}</div>${o.confirm?`<button class="btn wide">Confirm</button>`:''}</div>`;
const col=(c,n,k,body)=>`<div class="col"><div class="ch"><i style="background:${c}"></i>${n}<span class="n num">${k}</span></div>${body}</div>`;
const bar=(on)=>`<div class="top"><div class="brand"><span class="glyph"><i></i></span>Kanban</div><div class="seg"><a class="${on=='b'?'on':''}">Board</a><a class="${on=='a'?'on':''}">Agents</a><a>Keys</a></div><div class="right"><span class="live"><i></i>Live</span><span class="avatar">LU</span></div></div>`;
const head=`<div class="head"><h1>Board</h1><div class="pills"><span class="pill on">Main</span><span class="pill ghost">+ Project</span></div><div class="search"><span>＋</span>New task</div><div class="switch">Humans in loop<span class="sw"></span></div></div>`;
const rail=`<aside class="rail"><h2>Needs you <span class="badge num">4</span></h2>
<div class="need"><div class="kind" style="color:#C77700"><i style="background:var(--orange)"></i>Question from coder</div><h3>Fix flaky lease-expiry integration test</h3><p>Should I raise the test timeout or fix the clock mocking?</p><div class="acts"><button class="btn fill sm">Answer</button></div></div>
<div class="need"><div class="kind" style="color:var(--fg2)"><i style="background:var(--purple)"></i>Ready for review</div><h3>Cache board overview query</h3><p>Added 5s memoised overview; p95 down to 41ms.</p><div class="acts"><button class="btn fill sm">Approve</button><button class="btn sm">Request changes</button></div></div>
<div class="need"><div class="kind" style="color:var(--fg2)"><i style="background:var(--fg3)"></i>Confirm to start</div><h3>Add pagination to activity feed</h3><div class="acts" style="margin-top:8px"><button class="btn sm">Confirm</button></div></div>
<div class="need"><div class="kind" style="color:var(--fg2)"><i style="background:var(--fg3)"></i>Confirm to start</div><h3>Document MCP tool list in README</h3><div class="acts" style="margin-top:8px"><button class="btn sm">Confirm</button></div></div></aside>`;
const cols=`<div class="cols">
${col('var(--fg3)','Proposed',2,card({t:'Add pagination to activity feed',tags:['api'],who:'coder',c:'prop',confirm:1})+card({t:'Document MCP tool list in README',tags:['docs'],who:'docs-bot',c:'prop',confirm:1}))}
${col('var(--blue)','Confirmed',2,card({t:'Audit API key scopes',tags:['security']})+card({t:'Export activity log as CSV',tags:['feature']}))}
${col('var(--green)','In progress',4,card({t:'Rate-limit the public webhook endpoint',pri:'P3',tags:['api','security'],who:'coder',ring:.92})+card({t:'Fix flaky lease-expiry integration test',pri:'P3',tags:['tests'],who:'coder',ring:.25,rc:'var(--orange)',c:'ask',q:'Should I raise the test timeout or fix the clock mocking?'})+card({t:'Migrate session store to Postgres',tags:['backend'],who:'coder',ring:.75})+card({t:'Write onboarding guide for self-hosting',tags:['docs'],who:'docs-bot',ring:1}))}
${col('var(--purple)','Review',1,card({t:'Cache board overview query',ev:'Added 5s memoised overview; p95 down to 41ms. Invalidated on SSE events.',tags:['perf'],link:1,who:'reviewer'}))}
<div class="col collapsed"><b class="num">1</b>Done<span class="lnk">Show</span></div></div>`;
const R=document.getElementById('root');
if(v=='board')R.innerHTML=bar('b')+head+`<div class="app">${rail}${cols}</div>`;
if(v=='task')R.innerHTML=bar('b')+head+`<div class="app">${rail}${cols}</div><div class="scrim"></div><div class="sheet">
<div class="sh"><div class="row"><span class="pri">P3</span><span class="tag">tests</span><span class="tag">ci</span><span style="margin-left:auto">Esc to close</span></div><h1>Fix flaky lease-expiry integration test</h1></div>
<div class="facts"><div><small>Assignee</small><b style="color:var(--indigo)">coder</b></div><div><small>Status</small><b>In progress</b></div><div><small>Lease</small><b class="num">7 min left</b></div><div><small>Opened</small><b class="num">06:45</b></div></div>
<div class="blk ask"><h5>Question from coder</h5><div class="q">Should I raise the test timeout or fix the clock mocking?</div><div class="input">Write an answer…<button class="btn fill sm">Send</button></div></div>
<div class="blk"><h5>Description</h5>Fails roughly 1 in 20 runs on CI. Suspect real timers inside the lease sweeper.</div>
<div class="blk"><h5>Activity</h5><div class="tl"><div><time class="num">06:46</time><span><b>coder</b> asked a question</span></div><div><time class="num">06:46</time><span><b>coder</b> claimed this task</span></div><div><time class="num">06:45</time><span><b>Local user</b> confirmed</span></div><div><time class="num">06:45</time><span><b>Local user</b> created this task</span></div></div></div>
<div class="blk"><h5>Comments</h5><b>coder</b> <span style="color:var(--fg3)">06:46</span><div style="margin-top:2px">Reproduced locally with --repeat 50. Clock skew in sweeper.</div></div></div>`;
if(v=='agents'){const tr=[20,35,60,40,80,55,70,90,45,30,60,75,100,40,25,50,65,85,40,20,35,60,80,55];
const row=(n,st,cl,task,l,lb,t)=>`<div class="ar"><div class="nm"><span class="av ${n=='coder'?'coder':n=='docs-bot'?'docs':'rev'}">${n[0].toUpperCase()}</span><div><b>${n}</b><small class="${cl}">${st}</small></div></div><div>${task?`<div style="font-weight:500">${task}</div><div class="bars">${t.map(x=>`<i style="height:${x}%"></i>`).join('')}</div>`:`<span style="color:var(--fg3)">Last active 10 s ago</span>`}</div><div class="lease">${l!=null?`<span>${lb}</span><span class="track"><i style="width:${l*100}%;background:${l<.3?'var(--orange)':'var(--green)'}"></i></span>`:`<span style="color:var(--fg3)">No claim</span>`}</div></div>`;
R.innerHTML=bar('a')+`<div class="head"><h1>Agents</h1><div class="pills"><span class="pill on">Main</span><span class="pill">All projects</span></div></div>
<div class="tiles"><div class="tile"><small><i style="background:var(--green)"></i>Working</small><div class="big num">2<span> of 3</span></div></div><div class="tile" style="background:var(--orange);color:#fff"><small style="color:#fff"><i style="background:#fff"></i>Waiting on you</small><div class="big num">4</div></div><div class="tile"><small><i style="background:var(--fg3)"></i>Stale claims</small><div class="big num">0</div></div><div class="tile"><small><i style="background:var(--purple)"></i>Done today</small><div class="big num">1</div></div></div>
<div class="main"><div style="display:flex;flex-direction:column;gap:14px"><div class="panel"><h2>Agents</h2>${row('coder','Waiting on you','st-orange','Fix flaky lease-expiry integration test',.25,'7 min',tr)}${row('docs-bot','Working','st-blue','Write onboarding guide for self-hosting',1,'30 min',tr.slice().reverse())}${row('reviewer','Idle','st-grey','',null)}</div>
<div class="panel"><h2>Pipeline</h2><div class="pipe"><i style="flex:2;background:var(--fg3)"></i><i style="flex:2;background:var(--blue)"></i><i style="flex:4;background:var(--green)"></i><i style="flex:1;background:var(--purple)"></i><i style="flex:1;background:var(--fg2)"></i></div><div class="legend"><span style="--c:var(--fg3)">2 Proposed</span><span style="--c:var(--blue)">2 Confirmed</span><span style="--c:var(--green)">4 In progress</span><span style="--c:var(--purple)">1 Review</span><span style="--c:var(--fg2)">1 Done</span></div></div></div>
<div class="panel"><h2>Live activity</h2>${[['Local user','approved','Add dark mode to Agents screen'],['docs-bot','submitted','Add dark mode to Agents screen for review'],['reviewer','submitted','Cache board overview query for review'],['coder','asked a question on','Fix flaky lease-expiry integration test'],['docs-bot','claimed','Write onboarding guide'],['coder','claimed','Migrate session store to Postgres'],['coder','commented on','Rate-limit the public webhook endpoint'],['docs-bot','proposed','Document MCP tool list in README']].map(e=>`<div class="fe"><time class="num">06:46</time><span><b>${e[0]}</b> ${e[1]} ${e[2]}</span></div>`).join('')}</div></div>`;}
if(v=='system')R.innerHTML=bar('b')+`<div class="sys">
<div class="cellc" style="grid-column:span 7"><small>Typography — system font (SF Pro on Apple devices)</small><div style="font:700 44px/1.05 var(--font);letter-spacing:-.035em">Large title 700</div><div style="font:600 17px var(--font);margin-top:10px">Headline 600 · Card title 15 / 600 · Body 14 / 400 · Caption 12</div><div class="num" style="font:300 64px/1.1 var(--font);letter-spacing:-.04em;margin-top:8px;color:var(--fg2)">0123 456 789</div></div>
<div class="cellc" style="grid-column:span 5"><small>Colour — one accent, meaning-only status hues</small><div class="sws"><div style="background:#0071E3">Blue<br>Accent · confirmed</div><div style="background:#30B454">Green<br>Working</div><div style="background:#FF9F0A">Orange<br>Needs you</div><div style="background:#AF52DE">Purple<br>Review</div><div style="background:#F5F5F7;color:#1D1D1F;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)">Grey 100<br>Canvas</div><div style="background:#fff;color:#1D1D1F;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)">White<br>Card</div><div style="background:#1D1D1F">Label</div><div style="background:#FF3B30">Red<br>Priority · errors</div></div></div>
<div class="cellc" style="grid-column:span 4"><small>Lease — ring on cards, bar in tables</small><div class="row" style="gap:18px">${ring(1)}${ring(.75)}${ring(.25,'var(--orange)')}<span style="color:var(--fg2)">30 · 22 · 7 min</span></div></div>
<div class="cellc" style="grid-column:span 4"><small>Buttons — pills, one filled per group</small><div class="row"><button class="btn fill">Approve</button><button class="btn">Request changes</button><button class="btn">Confirm</button></div></div>
<div class="cellc" style="grid-column:span 4"><small>Surfaces</small><div style="font-size:13px;line-height:1.8">Radius 14 cards · 20 columns · 22 sheets<br>0.5 px separators · soft 2-layer shadow<br>Frosted bars and sheets (blur 20–30 px)<br>Light and dark follow the system</div></div></div>`;
</script></body></html>
