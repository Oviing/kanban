name: release
on:
  push: { tags: ["v*"] }
  # Manual run: publishes to npm only (no image/release), so a failed publish can be retried without re-tagging.
  workflow_dispatch: {}
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  image:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  npm:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm run build
      - run: npm run build:cli
      - name: check npm credentials
        run: npm whoami || { echo "::error::NPM_TOKEN is missing or invalid"; exit 1; }
      - name: tag must match package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./packages/cli/package.json').version")" = "$GITHUB_REF_NAME"
      - name: publish
        run: |
          set -o pipefail
          npm publish -w @joelkischkel/agent-kanban --access public 2>&1 | tee publish.log || {
            grep -q EOTP publish.log && echo "::error::npm asked for a one-time password: use a granular token with 'Bypass two-factor authentication' enabled, or a classic Automation token"
            exit 1
          }
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [image, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with: { generate_release_notes: true }
