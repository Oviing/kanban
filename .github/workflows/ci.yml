name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @kanban/core
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  package-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build && npm run build:cli
      - name: npx-style install of the tarball and smoke test
        run: |
          npm pack -w agent-kanban --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/inst" && cd "$RUNNER_TEMP/inst" && npm init -y >/dev/null
          npm i "$RUNNER_TEMP"/agent-kanban-*.tgz
          node_modules/.bin/agent-kanban --port 4123 --data-dir "$RUNNER_TEMP/data" &
          for i in $(seq 30); do curl -sf localhost:4123/healthz && break; sleep 1; done
          curl -sf localhost:4123/healthz
          curl -sf localhost:4123/ | grep -qi "<div id"
          curl -sf localhost:4123/api/boards
  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-kanban:ci .
      - name: run with embedded database (no-auth) and check health
        run: |
          docker run -d --name kb -p 3000:3000 -e AUTH_MODE=none -e HOST=0.0.0.0 -e ALLOW_NO_AUTH_REMOTE=true agent-kanban:ci
          for i in $(seq 30); do curl -sf localhost:3000/healthz && break; sleep 1; done
          curl -sf localhost:3000/healthz
          docker logs kb
